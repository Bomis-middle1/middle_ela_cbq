<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grade 7 English Quiz - Chapter 15: Direct and Indirect Speech</title>
    <style>
        :root {
            --slate-blue: #2b3a67;
            --mint-teal: #41b3a3;
            --amber-gold: #e27d60;
            --gold-dark: #c36246;
            --deep-purple: #1d1e2c;
            --cream-bg: #f4f7fc;
            --card-white: #ffffff;
            --success-green: #2ec4b6;
            --danger-red: #e71d36;
            --panel-radius: 20px;
            --elem-radius: 12px;
            --classic-shadow: 0 10px 30px rgba(43, 58, 103, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--cream-bg);
            color: var(--deep-purple);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: none;
            position: relative;
            z-index: 10;
            animation: panelFadeIn 0.4s ease-out forwards;
        }

        @keyframes panelFadeIn {
            0% { transform: scale(0.97); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            padding: 24px;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .splash-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--slate-blue);
            margin-bottom: 8px;
        }

        .splash-sub {
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(65, 179, 163, 0.1);
            border-top-color: var(--mint-teal);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .quiz-card {
            background: var(--card-white);
            padding: clamp(22px, 5vw, 36px);
            border-radius: var(--panel-radius);
            width: 100%;
            box-shadow: var(--classic-shadow);
            border: 1px solid rgba(43, 58, 103, 0.04);
            text-align: center;
        }

        h1, h2 {
            color: var(--slate-blue);
            font-size: clamp(22px, 4.5vw, 28px);
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--mint-teal);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .audio-ctrl-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(43, 58, 103, 0.05);
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 24px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .audio-ctrl-strip button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: var(--slate-blue);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hud-wrapper {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: var(--slate-blue);
            padding: 12px;
            border-radius: var(--elem-radius);
            font-size: 12px;
            font-weight: 700;
            color: white;
            margin-bottom: 16px;
            text-align: center;
        }

        .hud-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
            justify-content: center;
        }

        .hud-val {
            font-size: 15px;
            color: var(--mint-teal);
        }

        #timer-display {
            color: #ff9faf;
            font-weight: 800;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(43, 58, 103, 0.08);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--mint-teal), var(--success-green));
            transition: width 0.3s ease;
        }

        .question-statement {
            font-size: clamp(16px, 3.8vw, 17px);
            font-weight: 600;
            color: var(--deep-purple);
            text-align: left;
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .options-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-node {
            width: 100%;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: var(--elem-radius);
            padding: 14px 18px;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--deep-purple);
            text-align: left;
            cursor: pointer;
            transition: all 0.1s ease;
            line-height: 1.4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .option-node:hover:not(.locked-state) {
            border-color: var(--slate-blue);
            background: rgba(43, 58, 103, 0.01);
            transform: translateY(-1px);
        }

        .option-node.locked-state {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .option-node.correct-look {
            background: #e6f9f7 !important;
            border-color: var(--success-green) !important;
            color: var(--success-green) !important;
            font-weight: 700;
        }

        .option-node.wrong-look {
            background: #ffebee !important;
            border-color: var(--danger-red) !important;
            color: var(--danger-red) !important;
            font-weight: 700;
        }

        #feedback-alert {
            margin-top: 8px;
            font-size: 18px;
            font-weight: 800;
            display: none;
            text-align: center;
        }

        #explanation-card {
            margin-top: 16px;
            padding: 16px 20px;
            border-radius: var(--elem-radius);
            background: #f8fafc;
            border-left: 5px solid var(--slate-blue);
            font-size: 14.5px;
            line-height: 1.6;
            color: #4a5568;
            text-align: left;
            display: none;
        }

        .btn-ui-action {
            padding: 14px 28px;
            border: none;
            border-radius: var(--elem-radius);
            background: var(--amber-gold);
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            margin: 8px;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(226, 125, 96, 0.25);
        }

        .btn-ui-action:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
        }

        .review-scroll-container {
            max-height: 380px;
            overflow-y: auto;
            margin-top: 20px;
            padding-right: 6px;
            text-align: left;
        }
        .review-item-card {
            background: #f8fafc;
            border-radius: var(--elem-radius);
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }
        .final-challenge-badge {
            background: linear-gradient(135deg, #ffd700, var(--amber-gold));
            color: white;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-title">Chapter 15 — Direct and Indirect Speech</div>
        <div class="splash-sub">Grade 7 &bull; English Quiz</div>
        <div class="spinner"></div>
    </div>

    <div id="intro-screen" class="container" style="display: block;">
        <div class="quiz-card">
            <h1>Chapter 15 — Direct and Indirect Speech</h1>
            <div class="subtitle">Grade 7 English Language Arts</div>
            
            <div class="audio-ctrl-strip">
                <button onclick="toggleSoundEffects()" id="sfx-toggle-btn">🔊 Sound: ON</button>
            </div>

            <button class="btn-ui-action" onclick="initializeQuizEngine()">Start Quiz</button>
        </div>
    </div>

    <div id="question-screen" class="container">
        <div class="hud-wrapper">
            <div class="hud-block">
                <div>Progress</div>
                <div id="hud-index-val" class="hud-val">1 / 5</div>
            </div>
            <div class="hud-block">
                <div>⭐ Score</div>
                <div id="hud-score-val" class="hud-val">0</div>
            </div>
            <div class="hud-block">
                <div>Streak</div>
                <div id="hud-streak-val" class="hud-val">0 🔥</div>
            </div>
            <div class="hud-block">
                <div>Timer</div>
                <div id="timer-display" class="hud-val">45s</div>
            </div>
        </div>

        <div class="progress-container">
            <div id="progressBarFill" class="progress-fill"></div>
        </div>

        <div class="quiz-card">
            <div id="final-mode-indicator" class="final-challenge-badge" style="display: none;">⚡ Grammar Master Challenge ⚡</div>
            <div id="activeQuestionText" class="question-statement">Loading question...</div>
            <div id="activeOptionsStack" class="options-stack"></div>
            <div id="feedback-alert"></div>
            <div id="explanation-card"></div>
            <button id="next-btn" class="btn-ui-action" style="display: none; margin-top: 20px;" onclick="proceedToNextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Choose the correct indirect speech for:\nHe said, 'I am reading a book.'",
                options: [
                    "He said that he was reading a book.",
                    "He says that he is reading a book.",
                    "He said that I am reading a book.",
                    "He told that he was reading a book."
                ],
                answer: 0,
                explanation: "In indirect speech, the present continuous tense ('am reading') changes to the past continuous tense ('was reading'), and pronouns change accordingly."
            },
            {
                question: "Choose the correct direct speech for:\nShe told me that she liked ice cream.",
                options: [
                    "She said to me, 'I like ice cream.'",
                    "She said to me, 'She liked ice cream.'",
                    "She tells me, 'I liked ice cream.'",
                    "She said, 'I am liking ice cream.'"
                ],
                answer: 0,
                explanation: "The simple past tense in indirect speech ('liked') changes back to the simple present tense ('like') in direct speech."
            },
            {
                question: "Convert to indirect speech:\nTeacher said, 'The earth revolves around the sun.'",
                options: [
                    "Teacher said that the earth revolved around the sun.",
                    "Teacher said that the earth revolves around the sun.",
                    "Teacher told that the earth had revolved around the sun.",
                    "Teacher asked if the earth revolves around the sun."
                ],
                answer: 1,
                explanation: "Universal truths and habitual facts do not change their tense when converted into indirect speech."
            },
            {
                question: "Choose the correct indirect form:\nRahul said to me, 'Where are you going?'",
                options: [
                    "Rahul asked me where I was going.",
                    "Rahul asked me where were you going.",
                    "Rahul told me where am I going.",
                    "Rahul asked that where I was going."
                ],
                answer: 0,
                explanation: "For Wh- questions, the question word is retained, and the sentence structure changes from interrogative to declarative (subject + verb)."
            },
            {
                question: "Convert to indirect speech:\nMother said to me, 'Close the door.'",
                options: [
                    "Mother ordered me to close the door.",
                    "Mother told that close the door.",
                    "Mother asked if I closed the door.",
                    "Mother requested to closed the door."
                ],
                answer: 0,
                explanation: "Imperative sentences (commands/requests) use an infinitive verb ('to close') preceded by a reporting verb like 'ordered' or 'requested'."
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let streak = 0;
        let soundEnabled = true;
        let timeLeft = 45;
        let timerInterval = null;
        let userAnswers = [];

        window.onload = function() {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('intro-screen').style.display = 'block';
                }, 500);
            }, 800);
        };

        function toggleSoundEffects() {
            soundEnabled = !soundEnabled;
            const btnText = soundEnabled ? "🔊 Sound: ON" : "🔇 Sound: OFF";
            document.getElementById('sfx-toggle-btn').innerText = btnText;
        }

        function initializeQuizEngine() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('question-screen').style.display = 'block';
            currentIdx = 0;
            score = 0;
            streak = 0;
            userAnswers = [];
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 45;
            document.getElementById('timer-display').innerText = timeLeft + 's';
            
            const q = quizData[currentIdx];
            document.getElementById('hud-index-val').innerText = `${currentIdx + 1} / ${quizData.length}`;
            document.getElementById('hud-score-val').innerText = score;
            document.getElementById('hud-streak-val').innerText = `${streak} 🔥`;
            document.getElementById('progressBarFill').style.width = `${((currentIdx) / quizData.length) * 100}%`;
            
            document.getElementById('activeQuestionText').innerText = q.question;
            document.getElementById('feedback-alert').style.display = 'none';
            document.getElementById('explanation-card').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            const stack = document.getElementById('activeOptionsStack');
            stack.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-node';
                btn.innerText = opt;
                btn.onclick = () => handleAnswerSelection(idx);
                stack.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft + 's';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswerSelection(-1); // Time out
                }
            }, 1000);
        }

        function handleAnswerSelection(selectedIndex) {
            clearInterval(timerInterval);
            const q = quizData[currentIdx];
            const options = document.querySelectorAll('.option-node');
            
            options.forEach(opt => opt.classList.add('locked-state'));

            const isCorrect = (selectedIndex === q.answer);
            userAnswers.push({ question: q.question, selected: selectedIndex, correct: q.answer, options: q.options });

            if (isCorrect) {
                score += 10;
                streak++;
                if (selectedIndex !== -1) options[selectedIndex].classList.add('correct-look');
            } else {
                streak = 0;
                if (selectedIndex !== -1 && selectedIndex < options.length) {
                    options[selectedIndex].classList.add('wrong-look');
                }
                if (q.answer < options.length) {
                    options[q.answer].classList.add('correct-look');
                }
            }

            document.getElementById('hud-score-val').innerText = score;
            document.getElementById('hud-streak-val').innerText = `${streak} 🔥`;

            const feedback = document.getElementById('feedback-alert');
            feedback.style.display = 'block';
            feedback.style.color = isCorrect ? 'var(--success-green)' : 'var(--danger-red)';
            feedback.innerText = isCorrect ? 'Correct! 🎉' : (selectedIndex === -1 ? 'Time\'s Up! ⏰' : 'Incorrect! ❌');

            const explanation = document.getElementById('explanation-card');
            explanation.style.display = 'block';
            explanation.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;

            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function proceedToNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResultsScreen();
            }
        }

        function showResultsScreen() {
            const screen = document.getElementById('question-screen');
            screen.innerHTML = `
                <div class="quiz-card">
                    <h2>Quiz Completed! 🎉</h2>
                    <div class="subtitle">Your Final Score: ${score} / ${quizData.length * 10}</div>
                    <button class="btn-ui-action" onclick="initializeQuizEngine()">Play Again</button>
                </div>
            `;
        }
    </script>
</body>
</html>
