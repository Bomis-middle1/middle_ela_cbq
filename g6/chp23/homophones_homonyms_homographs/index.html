<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CBQ Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eef6ff, #f7fbff);
}

.center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  padding: 20px;
  box-sizing: border-box;
  text-align: center;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  width: 92%;
  max-width: 600px;
}

button {
  padding: 12px 24px;
  border: none;
  border-radius: 10px;
  background: #1976d2;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover {
  background: #1565c0;
}

.option {
  padding: 14px;
  margin: 10px 0;
  background: #f3f3f3;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  text-align: left;
  transition: background 0.2s;
}

.option:hover {
  background: #e3f2fd;
}

img {
  max-width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 12px;
  margin: 10px 0;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.top {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 6px;
}

.progress {
  height: 8px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 16px;
}

.fill {
  height: 100%;
  width: 0%;
  background: #4caf50;
  transition: width 0.3s ease;
}
</style>
</head>

<body>

<!-- SPLASH SCREEN -->
<div id="splash" class="center">
  <div class="card">
    <h2>Welcome to CBQ Quiz!</h2>
    <p>Loading game resources...</p>
    <button onclick="showIntro()">Continue</button>
  </div>
</div>

<!-- INTRO SCREEN -->
<div id="intro" class="center" style="display:none;">
  <div class="card">
    <h2>Homophones, Homonyms & Homographs</h2>
    <p>Read each question carefully and select the best answer before the timer runs out!</p>
    <button onclick="startGame()">START QUIZ</button>
  </div>
</div>

<!-- OBSERVE SCREEN -->
<div id="observe" class="center" style="display:none;">
  <div class="card">
    <h3>Observe Carefully</h3>
    <img id="obsImg" alt="Observation Graphic">
    <br>
    <button onclick="nextFromObserve()">Proceed to Question</button>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="quiz" class="center" style="display:none;">
  <div class="card">
    <div class="top">
      <div>Score: <span id="score">0</span></div>
      <div>Time Left: <span id="time">45</span>s</div>
    </div>

    <div class="progress"><div class="fill" id="fill"></div></div>

    <h3 id="qtext"></h3>
    <div id="options"></div>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="result" class="center" style="display:none;">
  <div class="card">
    <h2 id="finalMsg"></h2>
    <p id="finalScore"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>
const questions = [
  {
    type: "text",
    q: "Q1. Riya is texting directions to Aarav: \"Come to the park. I am ___ waiting for you near the gate.\" Which word correctly fills the blank?",
    options: ["their", "there", "here", "hear"],
    answer: "there"
  },
  {
    type: "text",
    q: "Q2. Meera is writing a recipe: \"Mix one cup of ___ with sugar and knead into dough.\" Which homophone is correct?",
    options: ["flower", "flour", "floor", "fleur"],
    answer: "flour"
  },
  {
    type: "observe",
    image: "https://via.placeholder.com/500x200?text=Worksheet:+they%27re+/+their+/+there",
    q: "Q6. [Worksheet Sentence Set] Which set correctly fills all four blanks in order?",
    options: [
      "they're / their / there / they're",
      "they're / there / their / their",
      "there / their / they're / there",
      "their / there / they're / their"
    ],
    answer: "there / their / they're / there"
  },
  {
    type: "observe",
    image: "https://via.placeholder.com/500x200?text=Sentence+Pairs:+Bat,+Bark,+Light,+Bank",
    q: "Q7. What type of word relationship is shown in the sentence pairs?",
    options: ["Homophones", "Homographs", "Homonyms", "Antonyms"],
    answer: "Homonyms"
  },
  {
    type: "text",
    q: "Q8. A student writes: \"I need to right a letter to my teacher.\" What is the error?",
    options: [
      "'right' is wrong → write",
      "'right' is correct",
      "'right' → rite",
      "'right' → wright"
    ],
    answer: "'right' is wrong → write"
  }
];

let index = 0;
let score = 0;
let time = 45;
let timer = null;

// Auto-advance splash to intro after 1.5s
window.addEventListener("load", () => {
  setTimeout(showIntro, 1500);
});

function showIntro() {
  document.getElementById("splash").style.display = "none";
  document.getElementById("intro").style.display = "flex";
}

function startGame() {
  document.getElementById("intro").style.display = "none";
  load();
}

function load() {
  if (index >= questions.length) {
    end();
    return;
  }

  let q = questions[index];
  updateProgressBar();

  if (q.type === "observe") {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("observe").style.display = "flex";
    document.getElementById("obsImg").src = q.image;
  } else {
    showQ(q);
  }
}

function nextFromObserve() {
  document.getElementById("observe").style.display = "none";
  showQ(questions[index]);
}

function showQ(q) {
  document.getElementById("quiz").style.display = "flex";
  document.getElementById("qtext").innerText = q.q;

  let optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";

  q.options.forEach(optText => {
    let div = document.createElement("div");
    div.className = "option";
    div.innerText = optText;
    div.onclick = function() { check(optText); };
    optionsContainer.appendChild(div);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timer);
  time = 45;
  document.getElementById("time").innerText = time;

  timer = setInterval(() => {
    time--;
    document.getElementById("time").innerText = time;
    if (time <= 0) {
      clearInterval(timer);
      next();
    }
  }, 1000);
}

function check(opt) {
  clearInterval(timer);
  let q = questions[index];

  if (opt === q.answer) {
    score++;
    document.getElementById("score").innerText = score;
  }
  next();
}

function next() {
  document.getElementById("quiz").style.display = "none";
  index++;
  load();
}

function updateProgressBar() {
  let percent = Math.round((index / questions.length) * 100);
  document.getElementById("fill").style.width = percent + "%";
}

function end() {
  clearInterval(timer);
  document.getElementById("quiz").style.display = "none";
  document.getElementById("observe").style.display = "none";
  document.getElementById("result").style.display = "flex";

  let percent = Math.round((score / questions.length) * 100);
  let msg = "Keep Practising!";
  if (percent >= 70) msg = "🏆 Outstanding!";
  else if (percent >= 60) msg = "🌟 Excellent!";
  else if (percent >= 45) msg = "😊 Good Job!";

  document.getElementById("finalMsg").innerText = msg;
  document.getElementById("finalScore").innerText =
    "Score: " + score + "/" + questions.length + " (" + percent + "%)";
}
</script>

</body>
</html>
