<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 5: Chapter 22 - Figures of Speech Quiz</title>
    <style>
        :root {
            --bg-gradient-start: #f3f8fa;
            --bg-gradient-end: #e9f2f7;
            --primary: #4a90e2;
            --primary-dark: #357abd;
            --success: #2ecc71;
            --error: #e74c3c;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Micro-Animations */
        .bg-animation {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape {
            position: absolute;
            opacity: 0.4;
            animation: float 15s infinite ease-in-out;
        }

        .bg-shape:nth-child(1) {
            top: 10%; left: 10%; width: 40px; height: 40px;
            border: 4px solid var(--primary); border-radius: 50%;
        }

        .bg-shape:nth-child(2) {
            top: 70%; left: 80%; width: 30px; height: 30px;
            background-color: #ffdb58; transform: rotate(45deg);
        }

        .bg-shape:nth-child(3) {
            top: 40%; left: 85%; width: 50px; height: 15px;
            background-color: var(--success); border-radius: 10px;
            animation-duration: 18s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* --- SPLASH SCREEN (VISIBLE FOR 5 SECONDS) --- */
        .splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #111215;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
        }

        .splash-logo {
            max-width: 240px;
            opacity: 0;
            transform: scale(0.9);
            animation: splashEntrance 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes splashEntrance {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .splash-screen.vanished {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Layout Containers */
        .app-container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .hidden { display: none !important; }

        .quiz-meta {
            font-size: 0.9rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .quiz-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .metrics-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #f8fafc;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid #edf2f7;
        }

        .metric {
            font-weight: 600;
            font-size: 1rem;
        }

        /* Question Formatting */
        .question-box {
            text-align: left;
            margin-bottom: 25px;
        }

        .context-text {
            background: #f7fafc;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 15px;
            color: #2d3748;
        }

        .prompt-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
            color: #1a202c;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px 20px;
            text-align: left;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            color: #334155;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f8faff;
        }

        .option-btn.correct-glow {
            border-color: var(--success);
            background: #edfbf3;
            color: #1e7e34;
            font-weight: 600;
        }

        .option-btn.wrong-glow {
            border-color: var(--error);
            background: #fdf2f2;
            color: #b91c1c;
        }

        .indicator-icon {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Feedback Area */
        .feedback-box {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            text-align: left;
            font-size: 1rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .feedback-box.retry-alert {
            background: #fff9db;
            border: 1px solid #ffe066;
            color: #856404;
        }

        .feedback-box.explanation-alert {
            background: #edf2f7;
            border-left: 4px solid var(--primary);
            color: var(--text);
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
            transition: all 0.2s;
            width: 100%;
            margin-top: 15px;
        }

        .action-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Confetti Canvas element */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .animate-shake {
            animation: shake 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Audio Elements -->
    <audio id="snd-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="snd-victory" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <!-- Canvas Layer for Effects -->
    <canvas id="confetti-canvas"></canvas>

    <div class="bg-animation">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>

    <!-- 1. SPLASH SCREEN (VISIBLE FOR 5 SECONDS) -->
    <div id="splash" class="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="splash-logo" onerror="this.src='https://via.placeholder.com/240x90?text=INNOVINE'">
    </div>

    <!-- 2. MAIN APP CONTAINER -->
    <div class="app-container">
        
        <!-- Game Screen -->
        <div id="game-card" class="card">
            <div class="metrics-bar">
                <div class="metric" id="progress-text">Q: 1/10</div>
                <div class="metric" id="score-text">Score: 0</div>
            </div>

            <div class="question-box">
                <div id="q-context" class="context-text"></div>
                <div id="q-prompt" class="prompt-text"></div>
            </div>

            <div class="options-grid" id="options-box"></div>

            <div id="feedback-panel" class="feedback-box hidden"></div>
            
            <button id="next-btn" class="action-btn hidden" onclick="quizController.handleNext()">Continue</button>
        </div>

        <!-- Result Screen -->
        <div id="result-card" class="card hidden">
            <div class="quiz-meta">Chapter 22 Complete</div>
            <h1 class="quiz-title">Performance Summary</h1>
            <div style="font-size: 3.5rem; font-weight: bold; color: var(--primary); margin: 20px 0;" id="final-score-display">
                0/10
            </div>
            <p id="final-evaluation-msg" style="font-size: 1.1rem; margin-bottom: 30px; color: var(--text-light); line-height: 1.5;"></p>
            <button class="action-btn" onclick="location.reload()">Try Again</button>
        </div>

    </div>

    <script>
        // Questions Dataset - Chapter 22 Figures of Speech
        const quizDataset = [
            {
                context: "Riya wrote in her poem: \"The stars were like tiny diamonds shining in the sky.\"",
                prompt: "Which figure of speech is used in this sentence?",
                options: ["Metaphor", "Simile", "Alliteration", "Onomatopoeia"],
                answer: "Simile",
                explanation: "A simile compares two different things using words such as 'like' or 'as'."
            },
            {
                context: "During a writing activity, Aarav described his teacher as: \"My teacher is a guiding star who helps me learn.\"",
                prompt: "Which figure of speech is used?",
                options: ["Simile", "Metaphor", "Alliteration", "Onomatopoeia"],
                answer: "Metaphor",
                explanation: "A metaphor directly compares two things by stating one thing IS another, without using 'like' or 'as'."
            },
            {
                context: "The sentence on the classroom board read: \"Busy bees buzzed beside beautiful blossoms.\"",
                prompt: "Which figure of speech is used?",
                options: ["Simile", "Metaphor", "Alliteration", "Onomatopoeia"],
                answer: "Alliteration",
                explanation: "Alliteration is the repetition of the same starting consonant sound in close words ('b' sound here)."
            },
            {
                context: "Kabir added this line to his comic: \"Bang! The door slammed shut.\"",
                prompt: "Why is the word “Bang” used?",
                options: [
                    "It compares two things.",
                    "It repeats the same sound.",
                    "It imitates a real sound.",
                    "It describes a person."
                ],
                answer: "It imitates a real sound.",
                explanation: "Onomatopoeia uses words that imitate real sound effects like 'Bang!', 'Splash!', or 'Buzz'."
            },
            {
                context: "Meera said: \"My little brother is as quick as a rabbit when he runs.\"",
                prompt: "Which figure of speech is used?",
                options: ["Simile", "Metaphor", "Alliteration", "Onomatopoeia"],
                answer: "Simile",
                explanation: "Comparing quickness to a rabbit using 'as...as' creates a simile."
            },
            {
                context: "A student wrote: \"The classroom was a zoo during the lunch break.\"",
                prompt: "What does this sentence use?",
                options: ["Simile", "Metaphor", "Alliteration", "Onomatopoeia"],
                answer: "Metaphor",
                explanation: "Describing the classroom as directly being a 'zoo' is a metaphor."
            },
            {
                context: "Look at the repetitive sound patterns in the following sentences.",
                prompt: "Which sentence uses alliteration?",
                options: [
                    "The moon was like a silver plate.",
                    "The wind made a whoosh sound.",
                    "Seven silly squirrels sat silently.",
                    "The ocean was a blue blanket."
                ],
                answer: "Seven silly squirrels sat silently.",
                explanation: "Repeating the starting 'S' sound in close sequence is an example of alliteration."
            },
            {
                context: "During a story, the writer used the word: \"Splash! The children jumped into the pool.\"",
                prompt: "Which figure of speech is shown by the word “Splash”?",
                options: ["Metaphor", "Simile", "Alliteration", "Onomatopoeia"],
                answer: "Onomatopoeia",
                explanation: "'Splash' mimics the actual sound of water being disturbed."
            },
            {
                context: "Ananya wrote: \"The football match was a battlefield as both teams tried their best to win.\"",
                prompt: "Which figure of speech is used?",
                options: ["Simile", "Metaphor", "Alliteration", "Onomatopoeia"],
                answer: "Metaphor",
                explanation: "Comparing the match directly to a 'battlefield' without using 'like' or 'as' forms a metaphor."
            },
            {
                context: "Identify the sentence that makes a comparison using 'as' or 'like'.",
                prompt: "Choose the sentence that uses simile.",
                options: [
                    "The stars are diamonds in the sky.",
                    "The puppy was as soft as cotton.",
                    "The snake slithered silently.",
                    "The bell went ding-dong."
                ],
                answer: "The puppy was as soft as cotton.",
                explanation: "'As soft as cotton' uses 'as...as' to explicitly compare softness, forming a simile."
            }
        ];

        // Quiz Logic Engine
        class StateController {
            constructor(data) {
                this.data = data;
                this.currentIndex = 0;
                this.score = 0;
                this.attempts = 0;
                this.hasAnswered = false;
            }

            initQuiz() {
                this.loadQuestion();
            }

            loadQuestion() {
                this.hasAnswered = false;
                this.attempts = 0;
                
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('feedback-panel').className = "feedback-box hidden";
                
                const qData = this.data[this.currentIndex];
                
                document.getElementById('progress-text').innerText = `Q: ${this.currentIndex + 1}/${this.data.length}`;
                document.getElementById('score-text').innerText = `Score: ${this.score}`;
                document.getElementById('q-context').innerText = qData.context;
                document.getElementById('q-prompt').innerText = qData.prompt;
                
                const optBox = document.getElementById('options-box');
                optBox.innerHTML = '';

                qData.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span>${opt}</span><span class="indicator-icon"></span>`;
                    btn.onclick = () => this.evaluateSelection(btn, opt);
                    optBox.appendChild(btn);
                });
            }

            evaluateSelection(selectedBtn, chosenValue) {
                if (this.hasAnswered) return;

                const qData = this.data[this.currentIndex];
                const isCorrect = (chosenValue === qData.answer);

                if (isCorrect) {
                    this.hasAnswered = true;
                    this.score++;
                    document.getElementById('score-text').innerText = `Score: ${this.score}`;
                    
                    selectedBtn.classList.add('correct-glow');
                    selectedBtn.querySelector('.indicator-icon').innerHTML = '✓';
                    
                    triggerStarConfetti();
                    playSound('snd-correct');
                    this.showFinalFeedback(true);
                } else {
                    this.attempts++;
                    selectedBtn.classList.add('animate-shake');
                    setTimeout(() => selectedBtn.classList.remove('animate-shake'), 400);

                    if (this.attempts === 1) {
                        // First Wrong Attempt: Allow retry
                        selectedBtn.classList.add('wrong-glow');
                        selectedBtn.querySelector('.indicator-icon').innerHTML = '×';
                        selectedBtn.disabled = true;
                        playSound('snd-wrong');
                        
                        const feed = document.getElementById('feedback-panel');
                        feed.className = "feedback-box retry-alert";
                        feed.innerText = "That's not quite right. Try again! Think about how the comparison or sound is created.";
                        feed.classList.remove('hidden');
                    } else {
                        // Second Wrong Attempt: Reveal answer
                        this.hasAnswered = true;
                        selectedBtn.classList.add('wrong-glow');
                        selectedBtn.querySelector('.indicator-icon').innerHTML = '×';
                        playSound('snd-wrong');
                        this.revealCorrectAnswer();
                        this.showFinalFeedback(false);
                    }
                }
            }

            revealCorrectAnswer() {
                const qData = this.data[this.currentIndex];
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(btn => {
                    if (btn.innerText.includes(qData.answer)) {
                        btn.classList.add('correct-glow');
                        btn.querySelector('.indicator-icon').innerHTML = '✓';
                    }
                });
            }

            showFinalFeedback(isCorrect) {
                const feed = document.getElementById('feedback-panel');
                feed.className = "feedback-box explanation-alert";
                
                if (isCorrect) {
                    feed.innerText = "Great job! " + this.data[this.currentIndex].explanation;
                } else {
                    feed.innerText = "Incorrect. " + this.data[this.currentIndex].explanation;
                }
                
                feed.classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
                this.disableAllOptions();
            }

            disableAllOptions() {
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            }

            handleNext() {
                this.currentIndex++;
                if (this.currentIndex < this.data.length) {
                    this.loadQuestion();
                } else {
                    this.showResults();
                }
            }

            showResults() {
                document.getElementById('game-card').classList.add('hidden');
                document.getElementById('result-card').classList.remove('hidden');
                
                const finalScoreStr = `${this.score}/${this.data.length}`;
                document.getElementById('final-score-display').innerText = finalScoreStr;
                
                const evalMsg = document.getElementById('final-evaluation-msg');
                const percentage = (this.score / this.data.length) * 100;
                
                if (percentage >= 80) {
                    evalMsg.innerText = "Fantastic effort! You've mastered figures of speech!";
                    playSound('snd-victory');
                    triggerStarConfetti();
                } else if (percentage >= 50) {
                    evalMsg.innerText = "Good job! You have a solid understanding of figures of speech. Keep practicing!";
                } else {
                    evalMsg.innerText = "Nice try! Review similes, metaphors, alliteration, and onomatopoeia to score higher next time!";
                }
            }
        }

        // Sound Player Helper
        function playSound(elementId) {
            const sound = document.getElementById(elementId);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio waiting for user click interaction."));
            }
        }

        // Star Effects Logic
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class StarParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 6 + 4;
                this.speedX = Math.random() * 8 - 4;
                this.speedY = Math.random() * -6 - 3;
                this.gravity = 0.2;
                this.color = `hsla(${Math.random() * 50 + 45}, 100%, 60%, 1)`;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }

            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.size + this.x,
                               Math.sin((18 + i * 72) * Math.PI / 180) * this.size + this.y);
                    ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size/2) + this.x,
                               Math.sin((54 + i * 72) * Math.PI / 180) * (this.size/2) + this.y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function triggerStarConfetti() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            for (let i = 0; i < 40; i++) {
                particles.push(new StarParticle(centerX, centerY));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Application Controller Lifecycle
        const quizController = new StateController(quizDataset);

        window.addEventListener('DOMContentLoaded', () => {
            // Dismiss Splash Screen after 5 seconds
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.classList.add('vanished');
                quizController.initQuiz();
            }, 5000);
        });
    </script>
</body>
</html>
